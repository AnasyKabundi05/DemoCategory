spring.application.name=demoForCategory

spring.datasource.url=jdbc:mysql://localhost:3306/demoForCategory?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# only if you use data.sql for starting data
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always